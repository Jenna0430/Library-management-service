version: "3.8"

services:
  app:
    build: .
    expose:
      - "80"
    env_file: .env
    depends_on:
      - database

  database:
    image: mysql:8.1
    environment:
      MYSQL_ROOT_PASSWORD: pass_word
      MYSQL_DATABASE: Library
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3306:3306"
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app    

volumes:
  database_data:
